# nginx-Konfiguration für substitute-sync.open-nexor.org.
#
# install.sh legt diese Datei unter /etc/nginx/sites-available/ an und
# verlinkt sie nach /etc/nginx/sites-enabled/.
#
# Nach dem Aktivieren ein Zertifikat holen:
#   sudo certbot --nginx -d substitute-sync.open-nexor.org

server {
    listen 80;
    listen [::]:80;
    server_name substitute-sync.open-nexor.org;

    # certbot stellt hier später die Weiterleitung auf HTTPS ein.
    location / {
        proxy_pass http://127.0.0.1:8384;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Die echte Adresse wird für die Drosselung pro IP gebraucht – ohne
        # sie sähe der Server nur "127.0.0.1" und jeder Nutzer teilte sich
        # ein einziges Kontingent.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Der Server nimmt bis zu 16 MiB an.
        client_max_body_size 16m;

        # Ein Sync-Lauf lädt alle Snapshots einer Kette auf einmal; auf einem
        # langsamen Mobilfunklink kann das dauern.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Antworten sind nie zwischenspeicherbar.
        proxy_buffering off;
    }
}

# Nach dem Einrichten des Zertifikats diesen Block aktivieren und den
# Port-80-Block auf die Weiterleitung beschränken:
