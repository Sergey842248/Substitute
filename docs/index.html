<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Substitute Sync Server</title>
<meta name="description" content="Status of the Substitute sync and share server.">
<style>
  :root {
    --bg: #101418;
    --fg: #e6e9ec;
    --muted: #8b949e;
    --ok: #3fb950;
    --down: #f85149;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fa; --fg: #1f2328; --muted: #59636e; }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    text-align: center;
    max-width: 30rem;
  }
  #status {
    font-size: clamp(1.5rem, 6vw, 2.25rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6em;
  }
  /* Der Punkt ist die einzige Farbangabe – der Text bleibt derselbe, ob der
     Server läuft oder nicht. */
  #dot {
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  #dot.running { background: var(--ok); }
  #dot.stopped { background: var(--down); }
  /* Bis die Antwort da ist, bleibt der Punkt grau – "unbekannt" soll nicht
     wie "läuft" aussehen. */
  footer {
    margin-top: 1.5rem;
    color: var(--muted);
    font-size: 0.8125rem;
  }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1 id="status"><span id="dot"></span><span id="text">…</span></h1>
  <footer>
    Substitute sync &amp; share server ·
    <a href="https://github.com/Sergey842248/Substitute/tree/main/docs/server">source</a>
  </footer>
</main>

<script>
  // Diese Adresse ist die einzige Konstante der Seite. Sie muss mit
  // `SyncEngine.defaultServerUrl` in der App übereinstimmen
  // (lib/services/sync/SyncEngine.dart).
  const SERVER = 'https://substitute-sync.open-nexor.org';

  const text = document.getElementById('text');
  const dot = document.getElementById('dot');

  // Genau zwei Zustände, wie gewünscht: "Server is running" oder
  // "Server is stopped". Kein Ladezustand, keine Fehlermeldung, keine
  // weiteren Angaben – die Seite sagt nur, ob der Server erreichbar ist.
  function show(running) {
    dot.className = running ? 'running' : 'stopped';
    text.textContent = running ? 'Server is running' : 'Server is stopped';
  }

  // `no-cors` liefert eine undurchsichtige Antwort, deren Status man nicht
  // prüfen kann – deshalb wird ohne `no-cors` gefragt. Der Server setzt
  // dafür `access-control-allow-origin: *`.
  fetch(`${SERVER}/v1/health`, { cache: 'no-store' })
    .then((response) => show(response.ok))
    .catch(() => show(false));

  // Alle fünf Sekunden neu fragen: Die Seite soll auch dann stimmen, wenn
  // jemand sie lange offen lässt.
  setInterval(() => {
    fetch(`${SERVER}/v1/health`, { cache: 'no-store' })
      .then((response) => show(response.ok))
      .catch(() => show(false));
  }, 5000);
</script>
</body>
</html>
