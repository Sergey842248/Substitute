name: Build iOS Simulator Debug App for Appetize

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-simulator-debug:
    name: Build and package Appetize-ready iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.6 and verify Apple tools
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
          echo "Runner architecture: $(uname -m)"
          xcrun simctl list devices available >/dev/null

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Validate Flutter project and read app version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml || \
                ! -d ios/Runner.xcodeproj || \
                ! -f ios/Runner.xcworkspace/contents.xcworkspacedata ]]; then
            echo "::error::Expected a Flutter project at repository root with ios/Runner.xcodeproj and ios/Runner.xcworkspace."
            exit 1
          fi

          VERSION_FIELD="$(python3 - <<'PYTHON'
          from pathlib import Path
          import re

          text = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(
              r"^version:\s*['\"]?([^\s'\"]+)['\"]?\s*(?:#.*)?$",
              text,
              re.MULTILINE,
          )

          if not match:
              raise SystemExit("Could not read the version field from pubspec.yaml")

          print(match.group(1))
          PYTHON
          )"

          if [[ ! "${VERSION_FIELD}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml must contain version: MAJOR.MINOR.PATCH+BUILD, for example version: 3.9.8+3908. Found: ${VERSION_FIELD}"
            exit 1
          fi

          APP_VERSION="${BASH_REMATCH[1]}"
          BUILD_NUMBER="${BASH_REMATCH[2]}"

          echo "App version: ${APP_VERSION} (${BUILD_NUMBER})"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Build iOS Simulator Debug app
        shell: bash
        env:
          APP_VERSION: ${{ steps.app-version.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.app-version.outputs.build_number }}
        run: |
          set -euo pipefail

          flutter build ios \
            --simulator \
            --debug \
            --no-codesign \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER"

      - name: Package and validate Appetize .app.zip
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphonesimulator/Runner.app"
          ZIP_PATH="${GITHUB_WORKSPACE}/Runner.app.zip"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Simulator app was not found at ${APP_PATH}"
            echo "Contents of build/ios:"
            find build/ios -maxdepth 4 -print || true
            exit 1
          fi

          INFO_PLIST="${APP_PATH}/Info.plist"
          if [[ ! -f "$INFO_PLIST" ]]; then
            echo "::error::Runner.app/Info.plist is missing."
            exit 1
          fi

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")"
          EXECUTABLE_PATH="${APP_PATH}/${EXECUTABLE_NAME}"
          if [[ ! -f "$EXECUTABLE_PATH" ]]; then
            echo "::error::App executable is missing: ${EXECUTABLE_PATH}"
            exit 1
          fi

          echo "Bundle identifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          echo "App executable architectures: $(/usr/bin/lipo -archs "$EXECUTABLE_PATH")"

          if ! /usr/bin/lipo -archs "$EXECUTABLE_PATH" | grep -qw arm64; then
            echo "::error::The simulator app does not contain an arm64 slice. Appetize recommends ARM simulator builds."
            exit 1
          fi

          # Include the complete Runner.app bundle as the top-level item in the ZIP.
          # ditto preserves macOS bundle metadata and directory structure.
          rm -f "$ZIP_PATH"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          /usr/bin/unzip -tq "$ZIP_PATH"
          if ! /usr/bin/unzip -Z1 "$ZIP_PATH" | grep -Fxq 'Runner.app/Info.plist'; then
            echo "::error::ZIP does not contain Runner.app/Info.plist at its root."
            /usr/bin/unzip -Z1 "$ZIP_PATH" | head -n 40
            exit 1
          fi
          if ! /usr/bin/unzip -Z1 "$ZIP_PATH" | grep -Fxq "Runner.app/${EXECUTABLE_NAME}"; then
            echo "::error::ZIP does not contain the app executable at the expected path."
            /usr/bin/unzip -Z1 "$ZIP_PATH" | head -n 40
            exit 1
          fi

          echo "Created Appetize upload file: ${ZIP_PATH}"
          echo "File size: $(du -h "$ZIP_PATH" | cut -f1)"
          echo "ZIP contents (first entries):"
          /usr/bin/unzip -Z1 "$ZIP_PATH" | head -n 20

      # archive:false is important: GitHub must expose Runner.app.zip itself,
      # not wrap it inside a second artifact ZIP that Appetize cannot parse.
      - name: Upload Runner.app.zip directly
        uses: actions/upload-artifact@v7
        with:
          path: Runner.app.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
