name: Build and upload iOS app to TestFlight

on:
  workflow_dispatch:
    inputs:
      testflight_group:
        description: 'Exact name of an existing external TestFlight testing group in App Store Connect'
        required: true
        type: string
        default: 'External Testers'
      changelog:
        description: 'What to test in this build'
        required: false
        type: string
        default: 'Automated build from GitHub Actions.'

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build, sign, and submit to TestFlight beta review
    runs-on: macos-26
    timeout-minutes: 90

    env:
      BUNDLE_ID: com.future.Substitute
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      TESTFLIGHT_GROUP: ${{ inputs.testflight_group }}
      TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.6 and verify Apple tools
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
          pod --version
          fastlane --version

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Validate configuration and required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TESTFLIGHT_GROUP; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret/input is missing: ${name}"
              exit 1
            fi
          done

          if [[ ! -f pubspec.yaml || ! -d ios/Runner.xcodeproj || ! -f ios/Runner.xcworkspace/contents.xcworkspacedata ]]; then
            echo "::error::Expected a Flutter project at repository root with ios/Runner.xcodeproj and ios/Runner.xcworkspace."
            exit 1
          fi

      - name: Install Flutter dependencies and prepare iOS project
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

          # App Store Connect requires a unique build number for each upload.
          BUILD_NUMBER="$(date -u +%s)"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"

          # Generate Flutter/iOS build configuration and CocoaPods integration.
          flutter build ios --release --no-codesign --build-number "${BUILD_NUMBER}"

      - name: Prepare App Store Connect API key and export options
        shell: bash
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          API_KEY_JSON="${RUNNER_TEMP}/asc_api_key.json"
          EXPORT_OPTIONS_PLIST="${RUNNER_TEMP}/ExportOptions.plist"

          printf '%s\n' "$ASC_PRIVATE_KEY" > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"

          cat > "$API_KEY_JSON" <<EOF
          {
            "key_id": "${ASC_KEY_ID}",
            "issuer_id": "${ASC_ISSUER_ID}",
            "key_filepath": "${AUTH_KEY_PATH}",
            "in_house": false
          }
          EOF
          chmod 600 "$API_KEY_JSON"

          cat > "$EXPORT_OPTIONS_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          EOF

          echo "ASC_AUTH_KEY_PATH=${AUTH_KEY_PATH}" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_JSON=${API_KEY_JSON}" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS_PLIST=${EXPORT_OPTIONS_PLIST}" >> "$GITHUB_ENV"

      - name: Archive iOS app with automatic signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/Substitute.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            FLUTTER_BUILD_NUMBER="${BUILD_NUMBER}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_AUTH_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            archive

      - name: Export signed App Store IPA
        id: export-ipa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ios-export"
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/Substitute.xcarchive" \
            -exportPath "${RUNNER_TEMP}/ios-export" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_AUTH_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

          IPA_PATH="$(find "${RUNNER_TEMP}/ios-export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "${IPA_PATH}" ]]; then
            echo "::error::Xcode export completed without producing an IPA file."
            exit 1
          fi
          echo "IPA_PATH=${IPA_PATH}" >> "$GITHUB_ENV"
          echo "Exported IPA: ${IPA_PATH}"

      - name: Upload to App Store Connect and submit for TestFlight beta review
        shell: bash
        run: |
          set -euo pipefail
          fastlane pilot upload \
            --api_key_path "${ASC_API_KEY_JSON}" \
            --app_identifier "${BUNDLE_ID}" \
            --ipa "${IPA_PATH}" \
            --distribute_external true \
            --groups "${TESTFLIGHT_GROUP}" \
            --submit_beta_review true \
            --changelog "${TESTFLIGHT_CHANGELOG}"
