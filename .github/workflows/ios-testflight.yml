name: Build and upload iOS app for internal TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build, sign, and upload for internal TestFlight
    runs-on: macos-26
    timeout-minutes: 90

    env:
      BUNDLE_ID: com.future.Substitute
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.6 and verify Apple tools
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select --switch /Applications/Xcode_26.6.app

          xcodebuild -version
          pod --version
          fastlane --version

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Validate configuration and required secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            APPLE_TEAM_ID \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_APP_STORE_PROFILE_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret/input is missing: ${name}"
              exit 1
            fi
          done

          if [[ ! -f pubspec.yaml ||
                ! -d ios/Runner.xcodeproj ||
                ! -f ios/Runner.xcworkspace/contents.xcworkspacedata ]]; then
            echo "::error::Expected a Flutter project at repository root with ios/Runner.xcodeproj and ios/Runner.xcworkspace."
            exit 1
          fi

      - name: Install Flutter dependencies and prepare iOS project
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

          VERSION_FIELD="$(python3 - <<'PYTHON'
          from pathlib import Path
          import re

          text = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(
              r"^version:\s*['\"]?([^\s'\"]+)['\"]?\s*(?:#.*)?$",
              text,
              re.MULTILINE,
          )

          if not match:
              raise SystemExit(
                  "Could not read the version field from pubspec.yaml"
              )

          print(match.group(1))
          PYTHON
          )"

          if [[ ! "${VERSION_FIELD}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml must contain version: MAJOR.MINOR.PATCH+BUILD, for example version: 3.9.8+3908. Found: ${VERSION_FIELD}"
            exit 1
          fi

          APP_VERSION="${BASH_REMATCH[1]}"
          BUILD_NUMBER="${BASH_REMATCH[2]}"

          echo "Using app version ${APP_VERSION} (${BUILD_NUMBER}) from pubspec.yaml"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"

          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${APP_VERSION}" \
            --build-number "${BUILD_NUMBER}"

      - name: Prepare App Store Connect API key and export options
        shell: bash
        run: |
          set -euo pipefail

          AUTH_KEY_PATH="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          API_KEY_JSON="${RUNNER_TEMP}/asc_api_key.json"
          EXPORT_OPTIONS_PLIST="${RUNNER_TEMP}/ExportOptions.plist"

          AUTH_KEY_PATH="$AUTH_KEY_PATH" \
          API_KEY_JSON="$API_KEY_JSON" \
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          key = (
              os.environ["ASC_PRIVATE_KEY"]
              .strip()
              .replace("\r\n", "\n")
          )

          # Support secrets containing literal "\n" sequences.
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")

          key_path = Path(os.environ["AUTH_KEY_PATH"])
          key_path.write_text(key + "\n", encoding="utf-8")
          key_path.chmod(0o600)

          api_key_json = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": key,
              "in_house": False,
          }

          json_path = Path(os.environ["API_KEY_JSON"])
          json_path.write_text(
              json.dumps(api_key_json),
              encoding="utf-8",
          )
          json_path.chmod(0o600)
          PYTHON

          cat > "$EXPORT_OPTIONS_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>signingCertificate</key>
            <string>Apple Distribution</string>

            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>__PROFILE_UUID__</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "ASC_AUTH_KEY_PATH=${AUTH_KEY_PATH}" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_JSON=${API_KEY_JSON}" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS_PLIST=${EXPORT_OPTIONS_PLIST}" >> "$GITHUB_ENV"

      - name: Install existing distribution certificate and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          CERTIFICATE_PATH="${RUNNER_TEMP}/distribution_certificate.p12"
          PROFILE_PATH="${RUNNER_TEMP}/app_store.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          PROFILE_PLIST="${RUNNER_TEMP}/app_store_profile.plist"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Decode the Base64-encoded GitHub Secrets.
          CERTIFICATE_PATH="$CERTIFICATE_PATH" \
          PROFILE_PATH="$PROFILE_PATH" \
          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path

          items = (
              (
                  "IOS_DISTRIBUTION_CERTIFICATE_BASE64",
                  "CERTIFICATE_PATH",
              ),
              (
                  "IOS_APP_STORE_PROFILE_BASE64",
                  "PROFILE_PATH",
              ),
          )

          for secret, destination in items:
              value = os.environ.get(secret, "")

              if not value:
                  raise SystemExit(
                      f"Required secret is empty: {secret}"
                  )

              try:
                  decoded = base64.b64decode(
                      value,
                      validate=True,
                  )
              except Exception as error:
                  raise SystemExit(
                      f"{secret} must contain valid Base64: {error}"
                  )

              Path(os.environ[destination]).write_bytes(decoded)
          PYTHON

          # Create and unlock an isolated temporary keychain.
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Explicit PKCS#12 format/type flags are important on macOS 26.
          # The password must be the export password of the .p12 file.
          security import "$CERTIFICATE_PATH" \
            -f pkcs12 \
            -t cert \
            -k "$KEYCHAIN_PATH" \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Permit Apple signing tools to access the imported private key.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Make the temporary keychain available to signing tools.
          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          # Verify that the keychain contains a valid signing identity.
          IDENTITY_OUTPUT="$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH"
          )"

          printf '%s\n' "$IDENTITY_OUTPUT"

          if ! grep -Eq \
            '^[[:space:]]*[1-9][0-9]* valid identities found' \
            <<< "$IDENTITY_OUTPUT"; then
            echo "::error::No valid code-signing identity was found in the imported .p12 file."
            exit 1
          fi

          # Decode and inspect the App Store provisioning profile.
          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :UUID' \
              "$PROFILE_PLIST"
          )"

          PROFILE_TEAM="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :TeamIdentifier:0' \
              "$PROFILE_PLIST"
          )"

          PROFILE_APP_ID="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$PROFILE_PLIST"
          )"

          PROFILE_GET_TASK_ALLOW="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:get-task-allow' \
              "$PROFILE_PLIST"
          )"

          if [[ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::The provisioning profile belongs to a different Apple Developer team."
            exit 1
          fi

          if [[ "$PROFILE_APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]]; then
            echo "::error::The provisioning profile does not match ${BUNDLE_ID}."
            exit 1
          fi

          if [[ "$PROFILE_GET_TASK_ALLOW" != "false" ]]; then
            echo "::error::The selected profile does not appear to be an App Store distribution profile."
            exit 1
          fi

          # Install the profile where Xcode expects to find it.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp \
            "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          # Replace the placeholder in ExportOptions.plist with the real UUID.
          sed -i '' \
            "s/__PROFILE_UUID__/${PROFILE_UUID}/" \
            "$EXPORT_OPTIONS_PLIST"

          echo "PROVISIONING_PROFILE_UUID=${PROFILE_UUID}" >> "$GITHUB_ENV"

          echo "Installed distribution certificate and provisioning profile."
          echo "Provisioning profile UUID: ${PROFILE_UUID}"

      - name: Archive iOS app with existing manual signing assets
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/Substitute.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_UUID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            FLUTTER_BUILD_NUMBER="${BUILD_NUMBER}" \
            archive

      - name: Export signed App Store IPA
        id: export-ipa
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/ios-export"

          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/Substitute.xcarchive" \
            -exportPath "${RUNNER_TEMP}/ios-export" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST}"

          IPA_PATH="$(
            find "${RUNNER_TEMP}/ios-export" \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              -quit
          )"

          if [[ -z "${IPA_PATH}" ]]; then
            echo "::error::Xcode export completed without producing an IPA file."
            exit 1
          fi

          echo "IPA_PATH=${IPA_PATH}" >> "$GITHUB_ENV"
          echo "Exported IPA: ${IPA_PATH}"

      - name: Upload to App Store Connect for internal TestFlight
        shell: bash
        run: |
          set -euo pipefail

          fastlane pilot upload \
            --api_key_path "${ASC_API_KEY_JSON}" \
            --app_identifier "${BUNDLE_ID}" \
            --ipa "${IPA_PATH}"