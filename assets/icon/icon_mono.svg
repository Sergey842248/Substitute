<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Die monochrome Fassung – für die Icons mit Farbschema (Android 13 und
    neuer) und für „Im Tintenmodus färben" auf iOS.

    **Kein Hintergrund.** Das System legt die Farbe fest: Es färbt diese Ebene
    ein. Eine eigene Fläche würde die Farbe des Systems überdecken, und genau
    das ist der Zweck dieser Ebene.

    **Nur eine Form, keine Details.** Wenn mehrere gleich helle Flächen
    nebeneinanderliegen, verschmelzen sie zu einem Fleck. Deshalb sind es hier
    ein Kalender mit einem ausgesparten Tauschring und sonst nichts: Der
    Unterschied zwischen Zeichnung und Aussparung bleibt erhalten, weil die
    Aussparung einfach **fehlt** – dort steht das Weiß des Systems durch.

    **Dieselben Maße und dieselben Zahlen wie die farbige Fassung**, damit
    beide Ebenen übereinanderliegen: Radius 126, Dicke 64, Spitzen 92 breit,
    Ringmitte (512, 587).
  -->
  <defs>
    <mask id="aus">
      <rect width="1024" height="1024" fill="#ffffff"/>
      <g fill="#000000">
        <rect x="208" y="380" width="608" height="20" rx="10"/>
        <path d="M 456.8 700.2 A 126 126 0 0 1 456.8 473.8" fill="none"
              stroke="#000000" stroke-width="64"/>
        <path d="M 567.2 473.8 A 126 126 0 0 1 567.2 700.2" fill="none"
              stroke="#000000" stroke-width="64"/>
        <path d="M 476.9 515.1 L 523.3 441.3 L 436.6 432.4 Z"/>
        <path d="M 547.1 658.9 L 500.7 732.7 L 587.4 741.6 Z"/>
      </g>
    </mask>
  </defs>

  <g fill="#ffffff" mask="url(#aus)">
    <rect x="352" y="210" width="56" height="130" rx="28"/>
    <rect x="616" y="210" width="56" height="130" rx="28"/>
    <rect x="208" y="250" width="608" height="524" rx="96"/>
  </g>
</svg>
