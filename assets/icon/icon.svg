<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Das Icon der App – die Quelle aller Dateien.

    **Kalender und Tauschring.** Kalender, weil es um den Stundenplan geht;
    der Ring, weil es um *Vertretung* geht – er ist das Zeichen, das auch in
    der App selbst steht. Die beiden geraden Pfeile, die vorher im Kalender
    lagen, sind durch zwei Pfeile auf einem Ring ersetzt: Sie sagen ohne
    Übersetzung, dass etwas im Kreis herum läuft, A ersetzt B und B ersetzt A.

    Warum ein Ring und nicht zwei Balken:

    * Zwei gegenläufige Gerade brauchen an ihren Enden Platz und kommen dort
      einander nahe. Im Ring ist der Abstand fest, und er sitzt in den beiden
      Lücken – dort ist jede Spitze am weitesten von der anderen entfernt.
    * Der Ring ist in jeder Richtung gleich breit und liegt damit in jeder
      Größe ruhig mittig. Die Balken füllten die Breite des Kalenders aus und
      wirkten dabei wie zwei Beschriftungen im Kalender, nicht wie ein Zeichen.

    **Alle Maße liegen im sicheren Bereich.** Für Android muss die Zeichnung in
    den mittleren 66 von 108 Punkten bleiben, weil der Rest vom Launcher
    abgeschnitten oder maskiert wird (Kreise, Squircle, auf manchen Geräten
    sogar ein Vollbild). Das ist hier eingehalten: Die Zeichnung reicht von 208
    bis 816, also genau die 608 Punkte, die übrig bleiben, wenn man den Rahmen
    wegdacht. Der Ring selbst liegt bei 308 mal 308 und damit weit innerhalb
    des Kalenders. Wer das später vergrößert, soll daran denken.

    **Kein Weiß am Rand, keine Rundungen.** iOS schneidet zu; eine Runde im
    Bild würde mit der des Systems eine doppelte Kante ergeben. Das ist unter
    Liquid Glass der schlimmste Fall: zwei Kanten übereinander.
  -->
  <defs>
    <!-- Der Verlauf geht von oben hell nach unten tief. Flacher Verlauf, weil
         ein Icon kein Bild ist: Ein Farbverlauf, der als Muster auffällt,
         konkurriert mit dem Zeichen darauf. -->
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b878f5"/>
      <stop offset="1" stop-color="#6f37b4"/>
    </linearGradient>

    <!-- Ein Schimmer oben links. Er lässt das Quadrat nicht flach wirken und
         wird von iOS unter dem Glas noch einmal gebrochen. -->
    <radialGradient id="schimmer" cx="0.3" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Die Aussparungen. Bewusst als Maske und nicht als eingefärbte Flächen:
         Ein ausgesparter Ring zeigt den Verlauf **darunter** und sitzt
         dadurch sauber auf jedem Untergrund. -->
    <mask id="aus">
      <rect width="1024" height="1024" fill="#ffffff"/>
      <g fill="#000000">
        <!-- Trennlinie unter der Kopfzeile des Kalenders -->
        <rect x="208" y="380" width="608" height="20" rx="10"/>

        <!-- Der Tauschring: zwei Bögen über je eine Ringhälfte, jeder mit einer
             Spitze. Radius 126, Dicke 64, Mitte (512, 587) – das ist die Mitte
             des Kalenderflecks zwischen Trennlinie und Unterkante.

             Die Lücken sind 52 Grad breit und liegen oben und unten. Ohne sie
             stiessen die beiden Spitzen aneinander; mit 20 Grad kamen sie
             sich bei 48 Punkten Bildgröße fast berührend. -->

        <!-- Die beiden Pfeile: **ein** geschlossener Pfad je Pfeil, nicht
             Bogen und Spitze als zwei Formen übereinander.

             Warum das wichtig ist: Zwei Formen, die sich überdecken, ergeben
             keine echte Kante zwischen sich – aber das Antialiasing weiss das
             nicht. Am Rand der einen Form wird die andere schon leicht
             eingeblendet, und im Maskenbild blieb dort ein heller, hauchdünner
             Saum stehen: eine weisse Linie zwischen Schaft und Spitze, genau
             an der Stelle, an der die beiden Formen sich treffen. In einem
             einzigen Pfad gibt es diese Kante nicht mehr, es gibt nur noch den
             Umriss.

             Der Umriss, von hinten nach vorn: der Aussenbogen (Radius 158) bis
             zum Ende, dann zwei kurze Stücke über den Bogenrand hinaus auf die
             Ecken der Spitze, die Spitze selbst, dieselben zwei Stücke zurück
             auf den Innenbogen (Radius 94) und der Innenbogen zurück zum
             Anfang. Die beiden kleinen Hörner an den Bogenrändern sind genau
             der Grund, warum die Spitze breiter ist als der Schaft: Sie stehen
             vor und hinter dem Schaft über. -->
        <path d="M 442.74 729.01 A 158 158 0 0 1 442.74 444.99
                 L 436.60 432.41 L 523.28 441.31 L 476.93 515.10
                 L 470.79 502.51 A 94 94 0 0 0 470.79 671.49 Z"/>
        <path d="M 581.26 444.99 A 158 158 0 0 1 581.26 729.01
                 L 587.40 741.59 L 500.72 732.69 L 547.07 658.90
                 L 553.21 671.49 A 94 94 0 0 0 553.21 502.51 Z"/>
      </g>
    </mask>
  </defs>

  <!-- Der Grund reicht bis in die Ecken: iOS erwartet ein randloses Quadrat. -->
  <rect width="1024" height="1024" fill="url(#grund)"/>
  <rect width="1024" height="1024" fill="url(#schimmer)"/>

  <g fill="#ffffff" mask="url(#aus)">
    <!-- Die beiden Aufhängungen -->
    <rect x="352" y="210" width="56" height="130" rx="28"/>
    <rect x="616" y="210" width="56" height="130" rx="28"/>
    <!-- Der Kalender -->
    <rect x="208" y="250" width="608" height="524" rx="96"/>
  </g>
</svg>
